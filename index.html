<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe3ee">
<title>1935 草山見聞帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed hand-drawn WebGL diorama; floating paper cards like a Showa-era tourist bird's-eye map */
:root{
  --sky-top:#bfe3ee;
  --sky-mid:#dcefee;
  --sky-bottom:#fbf2dc;
  --paper:#fffcf3;
  --ink:#3d3446;
  --ink-soft:#6c6378;
  --stamp:#de5b45;
  --moss:#5f9d6a;
  --earth:#8a6a4a;
  --sulfur:#c9a52c;
  --river:#4a9cc4;
  --town:#7d6aa8;
  --person:#c0703a;
  --line:#3d3446;
  --font-display:"Kaisei Decol","Zen Maru Gothic","Noto Serif TC","PingFang TC",serif;
  --font-body:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-bottom) 100%);
  background-color:var(--sky-bottom);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
}
#stage{position:fixed;inset:0;touch-action:none}
#night-sky{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 22% 8%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 37% 22%,#fffbe8 60%,transparent),
  radial-gradient(1px 1px at 48% 12%,#fff 60%,transparent),radial-gradient(2px 2px at 58% 6%,#fff 60%,transparent),radial-gradient(1px 1px at 66% 19%,#fff 60%,transparent),
  radial-gradient(1.5px 1.5px at 74% 10%,#fffbe8 60%,transparent),radial-gradient(1px 1px at 83% 24%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 91% 14%,#fff 60%,transparent),
  radial-gradient(1px 1px at 5% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 30% 33%,#fff 60%,transparent),radial-gradient(1px 1px at 52% 28%,#fff 60%,transparent),
  radial-gradient(1px 1px at 70% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 95% 34%,#fff 60%,transparent),radial-gradient(1px 1px at 16% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 87% 41%,#fff 60%,transparent)}
#night-sky .moon{position:absolute;right:18%;top:11%;width:34px;height:34px;border-radius:50%;background:#fff6d6;box-shadow:0 0 22px 6px rgba(255,240,200,.35)}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.card{position:fixed;background:var(--paper);border:2.5px solid var(--line);border-radius:18px;box-shadow:4px 5px 0 rgba(61,52,70,.18)}
.title-card{
  top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  display:inline-flex;gap:9px;align-items:center;padding:6px 10px 6px 7px;border-radius:999px;cursor:pointer;
  font:inherit;color:var(--ink);box-shadow:2px 3px 0 rgba(61,52,70,.18);transition:transform .12s;
}
.title-card:hover{transform:translateY(-1px)}
.title-card:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.title-card .yr{font:900 12px/1 var(--font-display);letter-spacing:.04em;background:var(--stamp);color:var(--paper);padding:5px 7px;border-radius:999px;border:1.5px solid var(--line);transform:rotate(-4deg)}
.title-card b{font-family:var(--font-display);font-size:18px;letter-spacing:.1em;line-height:1}
.title-card .n{font:700 11px/1 var(--font-body);color:var(--ink-soft);border-left:1.5px solid rgba(61,52,70,.25);padding-left:9px}
.title-card[aria-pressed="true"]{background:#f3ead6}
.stamp{
  flex:none;width:58px;height:58px;border-radius:12px;background:var(--stamp);color:var(--paper);
  font-family:var(--font-display);font-size:15px;line-height:1.15;display:grid;place-items:center;text-align:center;
  transform:rotate(-6deg);border:2px solid var(--line);
}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700}
h1{margin:2px 0;font-family:var(--font-display);font-size:28px;line-height:1.1;letter-spacing:.06em;text-wrap:balance}
.lede{margin:0;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.toolbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.toolbar button{
  font:700 13px/1 var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;
  padding:9px 14px;cursor:pointer;box-shadow:2px 3px 0 rgba(61,52,70,.18);transition:transform .12s;
}
.toolbar button:hover{transform:translateY(-1px)}
.toolbar button:active{transform:translateY(1px);box-shadow:1px 1px 0 rgba(61,52,70,.18)}
.toolbar button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.toolbar button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.info{
  left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));padding:16px 18px 16px;max-height:52vh;overflow:auto;
}
.info .chip{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--paper);background:var(--moss);border-radius:6px;padding:4px 8px}
.info .chip[data-kind="onsen"]{background:var(--stamp)}
.info .chip[data-kind="peak"]{background:var(--earth)}
.info .chip[data-kind="vent"]{background:var(--sulfur)}
.info .chip[data-kind="water"]{background:var(--river)}
.info .chip[data-kind="town"]{background:var(--town)}
.info .chip[data-kind="person"]{background:var(--person)}
.info .chip[data-kind="animal"]{background:var(--earth)}
.info .chip[data-kind="train"]{background:var(--river)}
.info h2{margin:8px 0 2px;font-family:var(--font-display);font-size:22px;line-height:1.25;text-wrap:balance}
.info .tag{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--stamp)}
.info p.body{margin:0;font-size:14px;line-height:1.75;max-width:60ch}
.info .note{margin:10px 0 0;font-size:12px;color:var(--ink-soft)}
.photo{margin:10px 0 12px;padding:8px 8px 6px;background:#f3ead6;border:1.5px solid var(--line);border-radius:6px;transform:rotate(-1deg)}
.photo img{display:block;width:100%;height:auto;filter:sepia(.35) contrast(1.05);border-radius:2px}
.photo figcaption{font-size:11px;line-height:1.5;color:var(--ink-soft);margin-top:4px}
.legend{
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:10px 14px;font-size:12px;line-height:1.6;max-width:280px;display:flex;gap:12px;align-items:center;
}
.compass{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);position:relative;background:var(--paper)}
.compass .needle{position:absolute;inset:0}
.compass .needle::before{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:16px solid var(--stamp)}
.compass .needle span{position:absolute;left:50%;top:21px;transform:translateX(-50%);font:900 11px/1 var(--font-body)}
.err{position:fixed;inset:0;display:grid;place-items:center;font-size:16px;padding:24px;text-align:center}
@media (max-width:720px){
  .title-card{padding:7px 12px 7px 8px}
  .title-card b{font-size:18px}
  .stamp{width:52px;height:52px;font-size:14px}
  h1{font-size:26px}
  .lede{font-size:13px;line-height:1.45;margin-top:2px}
  .toolbar{top:calc(14px + env(safe-area-inset-top,0px));gap:6px;flex-wrap:nowrap}
  .toolbar button{padding:9px 11px;font-size:14px}
  .title-card{padding:6px 10px 6px 6px;gap:7px}
  .title-card b{font-size:16px;letter-spacing:.05em}
  .info{max-height:44vh;padding:14px 16px;width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  .info .chip{font-size:13px;padding:5px 9px}
  .info h2{font-size:22px}
  .info .tag{font-size:15px}
  .info p.body{font-size:16px;line-height:1.7}
}

.zukan{right:max(16px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 32px));
  max-height:calc(100vh - 100px);display:flex;flex-direction:column;padding:14px 16px 12px;
  background:var(--paper) repeating-linear-gradient(180deg,transparent 0 27px,rgba(61,52,70,.06) 27px 28px)}
.zukan[hidden]{display:none}
.zk-head{display:flex;align-items:center;gap:10px}
.zk-head h2{margin:0;font-family:var(--font-display);font-size:22px;letter-spacing:.08em;flex:1}
.zk-close{font:900 16px/1 var(--font-body);width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.zk-intro{margin:6px 0 8px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.zk-sum{margin:4px 0 10px;font-size:12px;color:var(--ink-soft)}
.zk-bar{height:8px;border-radius:999px;border:1.5px solid var(--line);background:#efe6d2;overflow:hidden;margin-top:4px}
.zk-bar i{display:block;height:100%;background:var(--moss);width:0;transition:width .4s}
.zk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.zk-tabs button{font:700 12px/1 var(--font-body);padding:7px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.zk-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.zk-list{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 2px 4px;min-height:0}
.zk-item{text-align:left;font:inherit;color:var(--ink);background:#fffdf7;border:2px solid var(--line);border-radius:10px;padding:8px 9px;cursor:pointer;min-height:52px}
.zk-item b{display:block;font-family:var(--font-display);font-size:14px;line-height:1.3}
.zk-item span{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
.zk-item.new{box-shadow:0 0 0 3px var(--sulfur)}
.zk-item.unk{background:transparent;border-style:dashed;border-color:#b9b1c2;cursor:default;color:#a59db0}
.zk-item.unk b{letter-spacing:.2em}
.zk-item:not(.unk):hover{transform:translateY(-1px)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));transform:translateY(-8px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);font:700 13px/1 var(--font-body);padding:10px 16px;border-radius:999px;transition:opacity .3s,transform .3s;z-index:5;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
@media (max-width:720px){
  .zukan{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:62vh}
  .zk-item b{font-size:15px}.zk-item span{font-size:12px}.zk-tabs button{font-size:14px;padding:8px 12px}
  .toast{top:calc(60px + env(safe-area-inset-top,0px))}
}
@media (max-width:440px){.title-card .n{display:none}}
@media (prefers-reduced-motion:reduce){.toolbar button,.toast,.zk-bar i{transition:none}}
</style>
</head>

<div id="night-sky" aria-hidden="true"><div class="moon"></div></div>
<div id="stage" aria-label="昭和時期草山、北投、士林一帶的手繪風3D地景模型"></div>

<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">1935 草山見聞帖</h1>
<button class="card title-card" id="btn-zukan" aria-pressed="false" aria-controls="zukan" title="打開見聞帖"><span class="yr">1935</span><b>草山見聞帖</b><span class="n" id="zk-count">0</span></button>

<nav class="toolbar" aria-label="視角">
  <button id="tg-labels" aria-pressed="true">地名</button>
  <button id="tg-rotate" aria-pressed="true" title="自動旋轉">旋轉</button>
  <button id="btn-reset" aria-pressed="false" title="重設視角">重設</button>
</nav>

<aside class="card zukan" id="zukan" aria-label="見聞帖" hidden>
  <div class="zk-head"><h2>草山見聞帖</h2><button class="zk-close" id="zk-close" aria-label="關閉">×</button></div>
  <p class="zk-intro">昭和十年（1935）的大屯火山群與臺北近郊。點地名牌或任何一個小人物，看看他們的故事。</p>
  <p class="zk-sum" id="zk-sum"></p>
  <div class="zk-tabs" role="tablist" id="zk-tabs"></div>
  <div class="zk-list" id="zk-list"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<aside class="card info" id="info" aria-live="polite" hidden>
  <span class="chip" id="info-chip" data-kind="place">地景</span>
  <h2 id="info-title">竹子湖・蓬萊米原種田</h2>
  <p class="tag" id="info-tag">大正 12 年（1923）設原種田</p>
  <figure class="photo" id="info-photo" hidden>
    <img id="info-img" alt="">
    <figcaption id="info-cap"></figcaption>
  </figure>
  <p class="body" id="info-body"></p>
</aside>

const labelGroup=new THREE.Group();scene.add(labelGroup);const sprites=[];
function makeLabel(p){
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const fMain='900 46px "Zen Maru Gothic","Noto Sans TC",sans-serif',fSub='700 30px "Zen Maru Gothic","Noto Sans TC",sans-serif';
  x.font=fMain;const wm=x.measureText(p.name).width;const sub='';const ws=0;
  const pad=22,ic=-8,bh=78,tail=18,w=Math.ceil(pad+ic+12+wm+ws+pad+8),hh=bh+tail+8;c.width=w;c.height=hh;x.lineJoin='round';
  const rr=(X,Y,Wd,Hh,R)=>{x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+Wd,Y,X+Wd,Y+Hh,R);x.arcTo(X+Wd,Y+Hh,X,Y+Hh,R);x.arcTo(X,Y+Hh,X,Y,R);x.arcTo(X,Y,X+Wd,Y,R);x.closePath();};
  x.fillStyle='rgba(61,52,70,.22)';rr(7,8,w-10,bh-4,22);x.fill();
  x.fillStyle='#fffdf6';x.strokeStyle='#3d3446';x.lineWidth=5;rr(3,3,w-10,bh-4,22);x.fill();x.stroke();
  x.beginPath();x.moveTo(w/2-14,bh-2);x.lineTo(w/2,bh+tail);x.lineTo(w/2+14,bh-2);x.closePath();x.fill();x.stroke();x.fillStyle='#fffdf6';x.fillRect(w/2-12,bh-8,24,6);
    x.textBaseline='middle';
  x.textAlign='left';x.fillStyle='#3d3446';x.font=fMain;x.fillText(p.name,pad+ic+8,bh/2+3);
  if(sub){x.font=fSub;x.fillStyle='#6c6378';x.fillText(sub,pad+ic+8+wm+12,bh/2+5);}
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,depthWrite:false,transparent:true}));
  const s=(p.kind==='peak'?2.4:2.05)*(MOBILE?1.5:1);sp.userData={p,base:s,aspect:w/hh,k:1};sp.scale.set(s*w/hh,s,1);sp.center.set(0.5,0);
  sp.position.set(p.x,G(p.x,p.z)+p.dy,p.z);sp.renderOrder=20;labelGroup.add(sp);sprites.push(sp);
}

let lblT=0;
function updateLabelVis(dt){lblT-=dt;const cp=camera.position;
  if(lblT<=0){lblT=0.2;sprites.forEach(sp=>{const a=sp.position;const dx=cp.x-a.x,dy=cp.y-a.y,dz=cp.z-a.z,L=Math.hypot(dx,dy,dz);let ok=true;
    const n=Math.min(160,Math.ceil(L/0.7));for(let i=2;i<n;i++){const f=i/n;if(f*L>140)break;const x=a.x+dx*f,y=a.y+0.4+dy*f,z=a.z+dz*f;if(y<G(x,z)){ok=false;break;}}sp.userData.vis=ok?1:0;});}
  sprites.forEach(sp=>{const tgt=sp.userData.vis??1,m=sp.material;m.opacity+=(tgt-m.opacity)*Math.min(1,dt*5);sp.visible=m.opacity>0.03;});}
